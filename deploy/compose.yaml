name: laborin

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: laborin-backend:latest
    container_name: laborin-backend
    env_file:
      - .env.production
    expose:
      - "8000"
    networks:
      - edge
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-}
    image: laborin-web:latest
    container_name: laborin-web
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    name: facturaya-ai_default
    external: true
