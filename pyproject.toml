[project]
name = "proof-of-work-backend"
version = "0.1.0"
description = "FastAPI backend for the Proof of Work content pipeline."
requires-python = ">=3.12"
dependencies = [
  "convex==0.7.0",
  "cryptography>=50.0.1",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "openai>=3.6.0",
  "pydantic-settings>=2.15,<2.16",
  "uvicorn[standard]>=0.52,<0.53",
]

[dependency-groups]
dev = [
  "pyright>=1.1.411,<1.2",
  "pytest>=9.1,<9.2",
  "ruff>=0.16,<0.17",
]

[tool.pyright]
include = ["apps/backend"]
exclude = ["**/__pycache__"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]


[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
pythonpath = ["apps/backend"]
addopts = "-q"
